---
spring:
  application:
    name: "data-aggregator"
  datasource:
    password: "${POSTGRES_PASSWORD:data_aggregator}"
    url: "${POSTGRES_URL:jdbc:postgresql://localhost:5432/data_aggregator}"
    username: "${POSTGRES_USER:data_aggregator}"
  flyway:
    enabled: true
    locations: "classpath:db/migration"
  jpa:
    hibernate:
      ddl-auto: "none"
    open-in-view: false
  rabbitmq:
    host: "${RABBITMQ_HOST:localhost}"
    password: "${RABBITMQ_PASSWORD:guest}"
    port: "${RABBITMQ_PORT:5672}"
    username: "${RABBITMQ_USER:guest}"
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
data-aggregator:
  auth:
    mock-user-id: "${MOCK_USER_ID:user_local}"
  runtime-mode: "api"
  worker:
    placeholder-queue: "data-aggregator.worker.placeholder"
  workflow:
    completion-event-queue: "data-aggregator.workflow.completions"
    hybrid-chunk-search-version: 1
    lexical-queue: "search.lexical"
    relevance-score-queue: "enrichment.relevance_score"
    semantic-queue: "search.semantic"
    snapshot-projector-queue: "snapshot.projector"
