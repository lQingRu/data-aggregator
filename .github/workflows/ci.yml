---
name: "CI"
"on":
  pull_request: null
  push:
    branches:
    - "main"
jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        cache: "maven"
        distribution: "temurin"
        java-version: "21"
    - name: "Formatting"
      run: "./mvnw -B spotless:check"
    - name: "Static analysis"
      run: "./mvnw -B checkstyle:check"
    - name: "Unit tests"
      run: "./mvnw -B test"
    - name: "Build and integration tests"
      run: "./mvnw -B verify"
